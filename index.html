:root{
  --bg:#e8eef7;
  --shell:#f3f3f3;
  --sidebar:#f9f9f9;
  --surface:#ffffff;
  --surface-2:#f3f3f3;
  --text:#1b1b1b;
  --muted:#616161;
  --muted-2:#8a8a8a;
  --border:#e5e5e5;
  --hover:#ececec;
  --hover-2:#e8e8e8;
  --accent:#0067c0;
  --accent-soft:#d9eaf8;
  --accent-soft-2:#cfe6f7;
  --selected:#d6e8f8;
  --card:#ffffff;
  --shadow:0 24px 70px rgba(0,0,0,.28), 0 4px 18px rgba(0,0,0,.12);
  --title:#f3f3f3;
}

[data-theme="dark"]{
  --bg:#0f1115;
  --shell:#202020;
  --sidebar:#232323;
  --surface:#2b2b2b;
  --surface-2:#2d2d2d;
  --text:#f3f3f3;
  --muted:#b8b8b8;
  --muted-2:#8a8a8a;
  --border:#3a3a3a;
  --hover:#333333;
  --hover-2:#3d3d3d;
  --accent:#4cc2ff;
  --accent-soft:#2a3f52;
  --accent-soft-2:#314d66;
  --selected:#2f4b66;
  --card:#2b2b2b;
  --shadow:0 24px 70px rgba(0,0,0,.55);
  --title:#202020;
}

*{
  box-sizing:border-box
}

html,body,#root{
  height:100%
}

body{
  margin:0;
  font-family:"Segoe UI",Segoe UI,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text)
}

button{
  font-family:inherit
}

::-webkit-scrollbar{
  width:10px;
  height:10px
}

::-webkit-scrollbar-thumb{
  background:#c2c2c2;
  border-radius:99px;
  border:2px solid transparent;
  background-clip:content-box
}

[data-theme="dark"] ::-webkit-scrollbar-thumb{
  background:#555;
  border:2px solid transparent;
  background-clip:content-box
}

.win-btn{
  height:32px;
  padding:0 10px;
  border-radius:6px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:13px;
  color:var(--text);
  background:transparent;
  border:1px solid transparent;
  white-space:nowrap;
  cursor:pointer
}

.win-btn:hover{
  background:var(--hover)
}

.win-btn.active{
  background:var(--accent-soft);
  border-color:var(--accent)
}

.win-btn:disabled{
  opacity:.42;
  cursor:not-allowed
}

.win-btn.primary{
  background:var(--accent);
  color:#fff
}

.win-btn.primary:hover{
  filter:brightness(1.08)
}

.icon-btn{
  width:32px;
  height:32px;
  border-radius:6px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:0;
  color:var(--text);
  cursor:pointer;
  flex:none
}

.icon-btn:hover{
  background:var(--hover)
}

.icon-btn:disabled{
  opacity:.35;
  cursor:not-allowed
}

.chip{
  font-size:12px;
  padding:4px 8px;
  border-radius:99px;
  background:var(--surface-2);
  border:1px solid var(--border)
}

.tab{
  height:32px;
  min-width:0;
  border-radius:8px 8px 0 0;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 8px 0 12px;
  font-size:13px;
  cursor:pointer;
  border:1px solid transparent;
  border-bottom:0;
  background:transparent;
  color:var(--muted)
}

.tab.active{
  background:var(--surface);
  color:var(--text);
  border-color:var(--border);
  box-shadow:0 -1px 4px rgba(0,0,0,.04)
}

.crumb{
  padding:5px 7px;
  border-radius:6px;
  font-size:13px;
  cursor:pointer;
  white-space:nowrap
}

.crumb:hover{
  background:var(--hover)
}

.item-card{
  border:1px solid transparent;
  border-radius:8px;
  cursor:pointer;
  -webkit-user-select:none;
     -moz-user-select:none;
          user-select:none
}

.item-card:hover{
  background:var(--hover)
}

.item-card.selected{
  background:var(--selected);
  border-color:var(--accent)
}

.item-row{
  border:1px solid transparent;
  border-radius:6px;
  cursor:pointer
}

.item-row:hover{
  background:var(--hover)
}

.item-row.selected{
  background:var(--selected)
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(6px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.fade-up{
  animation:fadeUp .22s ease both
}

@keyframes pop{
  from{
    opacity:0;
    transform:scale(.97)
  }

  to{
    opacity:1;
    transform:scale(1)
  }
}

.pop{
  animation:pop .16s ease both
}

input,select{
  font-family:inherit
}

@keyframes welcomeZoom{
  from{
    opacity:0;
    transform:scale(1.06)
  }

  to{
    opacity:1;
    transform:scale(1)
  }
}

@keyframes welcomeFade{
  from{
    opacity:0;
    transform:translateY(8px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes welcomeSpin{
  from{
    transform:rotate(0deg)
  }

  to{
    transform:rotate(360deg)
  }
}

.welcome-bg{
  animation:welcomeZoom 1.2s ease both
}

.welcome-fade-in{
  animation:welcomeFade .7s ease both
}

.welcome-dots{
  animation:welcomeSpin 1.25s linear infinite
}

html,body{
  overflow:hidden;
  max-width:100vw
}

@media (max-width:1366px){
  .win-btn{
    height:30px;
    padding:0 8px;
    font-size:12.5px;
    gap:6px
  }

  .icon-btn{
    width:30px;
    height:30px
  }

  .tab{
    height:30px;
    font-size:12.5px;
    padding:0 6px 0 10px;
    gap:6px
  }

  .crumb{
    padding:4px 6px;
    font-size:12.5px
  }

  .item-card{
    padding:8px 6px
  }

  .item-card p{
    font-size:12px
  }
}

@media (max-width:1366px) and (max-height:768px){

    height:28px;

  }

    width:28px;
    height:28px
  }

  .tab{
    height:28px;
    font-size:12px

    width:8px;
    height:8px

belajar, kerja, streaming, atau sekadar chatting.",category:"Paket Internet",date:"11 Mei 2026",c1:"#0E7490",c2:"#22D3EE",icon:"wifi",paragraphs:["Kebutuhan internet setiap orang berbeda. Karena itu Dukun ComCell menyediakan pilihan paket mulai dari Rp10 ribu untuk pemakaian ringan, sampai paket bulanan untuk pemakaian yang lebih besar dan stabil.","Tim toko akan membantu menjelaskan masa aktif, total kuota, dan pembagian kuota utama serta bonus, supaya pelanggan tidak salah pilih. Jika ragu, ceritakan saja kebiasaan pemakaian sehari-hari.","Untuk pelajar dan pekerja, paket mingguan sering jadi pilihan paling seimbang. Untuk yang sering streaming, paket bulanan dengan kuota besar lebih nyaman karena tidak perlu isi ulang berkali-kali."]},{id:"p-service",title:"Service HP Cepat — Ganti LCD & Baterai",excerpt:"Layar retak, baterai boros, atau HP tidak mau menyala? Diagnosa dulu, jelaskan biaya di awal, baru dikerjakan.",category:"Service HP",date:"10 Mei 2026",c1:"#7C3AED",c2:"#C084FC",icon:"wrench",paragraphs:["Kerusakan HP tidak selalu berarti harus ganti perangkat baru. Di Dukun ComCell, kerusakan diperiksa dulu untuk mengetahui penyebabnya, lalu pelanggan diberi penjelasan biaya dan estimasi waktu sebelum pengerjaan dimulai.","Layanan yang paling sering ditangani adalah ganti LCD, ganti baterai, perbaikan port charger, dan perbaikan software ringan. Sparepart yang digunakan dijelaskan secara terbuka agar pelanggan tahu apa yang dipasang.","Setelah service selesai, pelanggan bisa mengecek fungsi utama di tempat — layar sentuh, baterai, suara, dan charger. Jika ada hal yang terasa janggal, sampaikan langsung agar bisa diperiksa kembali."]},{id:"p-second",title:"Jual HP Second Bergaransi Toko",excerpt:"Cari HP second yang masih layak pakai? Setiap unit dicek fisik, fungsi, dan kelengkapan sebelum dipajang.",category:"HP Second",date:"9 Mei 2026",c1:"#B45309",c2:"#F59E0B",icon:"bag",paragraphs:["Membeli HP second terasa lebih aman kalau unitnya sudah diperiksa. Setiap unit di Dukun ComCell dicek kondisi fisik, layar, baterai, kamera, speaker, sinyal, dan kelengkapan yang menyertainya.","Pelanggan juga bisa mencoba unit di toko sebelum memutuskan. Tim akan menjelaskan kondisi apa adanya, termasuk goresan kecil atau bagian yang sudah pernah diganti, supaya tidak ada yang ditutup-tutupi.","Setiap pembelian HP second dilengkapi garansi toko. Simpan bukti pembelian dan sampaikan keluhan dalam masa garansi jika ada fungsi yang tidak berjalan sebagaimana dijelaskan saat pembelian."]},{id:"p-aksesoris",title:"Aksesoris HP Lengkap — Case, Tempered Glass, Charger",excerpt:"Lindungi HP sejak hari pertama. Pilihan case, pelindung layar, charger, kabel, headset, dan holder lengkap di satu tempat.",category:"Aksesoris",date:"8 Mei 2026",c1:"#DB2777",c2:"#F472B6",icon:"headphones",paragraphs:["Aksesoris bukan sekadar pelengkap. Case yang pas dan tempered glass yang terpasang rapi bisa mengurangi risiko kerusakan saat HP terjatuh atau tergores di dalam tas.","Di Dukun ComCell tersedia case untuk berbagai tipe HP, tempered glass, charger dan kabel, headset, holder motor dan mobil, serta kebutuhan harian lainnya. Stok tipe yang tersedia bisa ditanyakan langsung kepada tim toko.","Jika pelanggan baru saja membeli HP, tim bisa membantu memasangkan tempered glass di tempat. Pemasangan yang rapi membuat layar tetap responsif dan bebas gelembung."]},{id:"p-game",title:"Top Up Game & Voucher — ML, FF, PUBG",excerpt:"Diamond dan voucher game favorit bisa diisi di toko. Sebutkan ID game, pilih nominal, dan tunggu konfirmasi masuk.",category:"Top Up Game",date:"7 Mei 2026",c1:"#7C2D12",c2:"#EA580C",icon:"game",paragraphs:["Untuk pemain Mobile Legends, Free Fire, PUBG Mobile, dan game populer lainnya, Dukun ComCell menyediakan layanan top up dengan berbagai pilihan nominal. Pelanggan cukup membawa ID game yang benar.","Sebelum transaksi diproses, tim akan mengonfirmasi nama akun dan nominal agar tidak salah kirim. Setelah pembayaran, pelanggan bisa menunggu konfirmasi saldo masuk di dalam game.","Layanan ini cocok untuk yang tidak ingin ribet mengisi saldo dompet digital sendiri. Cukup datang ke toko, sebutkan kebutuhan, dan transaksi dibantu sampai selesai."]},{id:"p-tips",title:"Cara Cek Kuota & Pulsa Tanpa Ribet (Tips)",excerpt:"Kuota habis di tengah jalan? Simpan cara cepat ini: cek lewat aplikasi operator, kode USSD, atau tanya langsung ke toko.",category:"Tips",date:"6 Mei 2026",c1:"#166534",c2:"#22C55E",icon:"bulb",paragraphs:["Cara paling praktis untuk mengecek kuota adalah lewat aplikasi resmi operator. Di sana terlihat sisa kuota utama, kuota bonus, dan masa aktif paket dalam satu tampilan. Pastikan aplikasi sudah masuk dengan nomor yang benar.","Jika kuota aplikasi tidak tersedia, pelanggan bisa menggunakan kode USSD operator atau SMS sesuai panduan masing-masing operator. Cara ini tetap berguna saat sinyal data sedang tidak stabil.","Kalau masih ragu, datang saja ke Dukun ComCell. Tim toko bisa membantu mengecek dan menyarankan paket yang paling sesuai dengan sisa masa aktif dan kebiasaan pemakaian pelanggan."]},{id:"p-koner",title:"Buka Konter Pulsa? Modal Kecil Untung Besar",excerpt:"Mulai usaha konter dari rumah dengan modal terukur. Pelajari produk yang paling laris, cara mencatat, dan cara melayani pelanggan.",category:"Lainnya",date:"5 Mei 2026",c1:"#1E3A8A",c2:"#6366F1",icon:"store",paragraphs:["Usaha konter pulsa bisa dimulai dari skala kecil. Modal awal dipakai untuk saldo produk yang paling sering dicari, seperti pulsa, paket internet, dan top up game. Tidak perlu langsung melengkapi semua produk sekaligus.","Kunci yang sering membuat konter bertahan adalah pencatatan yang rapi dan pelayanan yang cepat. Catat setiap transaksi, pisahkan uang usaha dan uang pribadi, dan selalu konfirmasi nomor tujuan sebelum memproses.","Dukun ComCell siap berbagi pengalaman praktis untuk yang ingin memulai. Datang ke toko untuk berdiskusi tentang produk awal, target pelanggan di sekitar rumah, dan cara mengatur s
